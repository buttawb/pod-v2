services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pod
      POSTGRES_PASSWORD: pod_dev_only
      POSTGRES_DB: pod
      POD_APP_PASSWORD: pod_app_dev_only
    ports:
      - "5433:5432"
    volumes:
      - pod_pg_dev:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro

volumes:
  pod_pg_dev:
