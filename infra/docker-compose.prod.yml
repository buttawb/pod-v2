# Production stack: Caddy load-balancing across two backend instances.
# The brief says "assume it runs behind a load balancer with more than one
# instance" - so we actually run two: idempotency and SSE fan-out are
# exercised across instances, not just designed for it.
#
# There is no database service here. Postgres is an Aurora Serverless v2 cluster
# of its own, in private subnets, which the backends reach over the VPC using
# the connection string deploy.sh renders into .env. Nothing on this box stores
# data, and that is what makes the instance disposable: it can be replaced
# without anyone having to think about what was on its disk.
services:
  backend-1:
    image: pod-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      INSTANCE_ID: backend-1

  backend-2:
    image: pod-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      INSTANCE_ID: backend-2

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend-1
      - backend-2

volumes:
  caddy_data:
  caddy_config:
