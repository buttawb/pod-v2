# Production stack: Caddy load-balancing across two backend instances.
# The brief says "assume it runs behind a load balancer with more than one
# instance" - so we actually run two: idempotency and SSE fan-out are
# exercised across instances, not just designed for it.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POD_APP_PASSWORD: ${POD_APP_PASSWORD}
    # Bound to the host so a SQL client can reach the demo data directly during
    # the walkthrough. The backends never needed this: they reach postgres over
    # the compose network by service name.
    #
    # An earlier version of this comment said the host firewall decides who gets
    # here. That was wrong on both halves. Docker publishes ports by writing its
    # own iptables DNAT rules, which are traversed before the host's filter
    # rules, so firewalld or ufw on the box do not gate this. The only thing
    # gating it is the EC2 security group, which today carries no 5432 rule at
    # all. The listener is therefore up on 0.0.0.0 and reachable from nothing.
    #
    # Which means this line is one security group rule away from publishing a
    # database that holds driver password hashes and speaks no TLS. Remove it
    # when the walkthrough is done.
    ports:
      - "5432:5432"
    volumes:
      - pod_pg:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-1:
    image: pod-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      INSTANCE_ID: backend-1
    depends_on:
      postgres:
        condition: service_healthy

  backend-2:
    image: pod-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      INSTANCE_ID: backend-2
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend-1
      - backend-2

volumes:
  pod_pg:
  caddy_data:
  caddy_config:
